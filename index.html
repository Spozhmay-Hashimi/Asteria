<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteria</title>
    <link rel="stylesheet" href="style.css" />
    <!-- bootstrap:CSS Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Font Awesome Link   -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
      <div class="container">
        <a class="navbar-brand logo-text" href="#">ASTERIA</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <i class="bi bi-list text-white fs-3"></i>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#missions">Missions</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#explore">Explore</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#news">News & Gallery</a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <div class="search-box">
              <i class="bi bi-search"></i>
              <input type="text" placeholder="Search..." />
            </div>
            <a href="#explore" class="btn btn-glow">Explore Universe</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- ===== HERO SECTION ===== -->
    <section class="hero-section">
      <div class="stars"></div>
      <div class="stars2"></div>
      <div class="stars3"></div>
      <div class="container hero-content">
        <div class="row align-items-center min-vh-100">
          <div class="col-lg-8">
            <span class="badge-tag">🚀 Welcome to the Cosmos</span>
            <h1 class="hero-title">
              EXPLORE THE<br />
              <span class="gradient-text">UNIVERSE</span>
            </h1>
            <p class="hero-desc">
              Journey beyond the stars with ASTERIA — your gateway to space
              missions, cosmic discoveries, and the wonders of our galaxy.
            </p>
            <div class="hero-btns">
              <a href="#explore" class="btn btn-primary-glow me-3">
                <i class="bi bi-rocket-takeoff"></i> Explore Now
              </a>
              <button
                type="button"
                class="btn btn-outline-glow"
                id="watchVideoBtn"
              >
                <i class="bi bi-play-circle"></i> Watch Video
              </button>
            </div>
          </div>
        </div>
        <div class="scroll-indicator">
          <span>Scroll Down</span>
          <div class="mouse">
            <div class="wheel"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- ===== VIDEO MODAL ===== -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content video-modal-content">
          <button
            type="button"
            class="btn-close-custom"
            data-bs-dismiss="modal"
          >
            <i class="bi bi-x-lg"></i>
          </button>
          <div class="modal-body p-0">
            <video id="spaceVideo" controls class="w-100">
              <source
                src="https://cdn.coverr.co/videos/coverr-the-iss-in-space-1572/1080p.mp4"
                type="video/mp4"
              />
              Your browser does not support the video tag.
            </video>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript Link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
