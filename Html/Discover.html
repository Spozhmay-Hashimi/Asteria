<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page Title -->
    <title>Asteria | Explore</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Asteria Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="../CSS/Style.css" />
  </head>
  <body>
    <!-- Hero Container -->
    <div class="container">
      <!-- Hero Row -->
      <div class="row align-items-center">
        <!-- Hero Text -->
        <div class="col-lg-6">
          <!-- Small Heading -->
          <p class="hero-small-title">EXPLORE SPACE</p>

          <!-- Main Heading -->
          <h1>Discover Our Universe</h1>

          <!-- Hero Description -->
          <p class="hero-text">
            Journey beyond our world and discover the planets, galaxies and
            stars of our universe.
          </p>

          <!-- Explore Button -->
          <a href="#explore" class="explore-button"> Explore Universe </a>
        </div>

        <!-- Hero Image -->
        <div class="col-lg-6">
          <!-- Saturn Image -->
          <div class="hero-image">
            <img src="background.jpg" alt="" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
