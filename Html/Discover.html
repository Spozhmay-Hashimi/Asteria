<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteria | Explore</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Asteria Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- External CSS -->
    <link rel="stylesheet" href="../CSS/Style.css" />
  </head>
  <body>
    <!-- Hero Background -->
    <img src="../explore-images/hero.jpg" class="hero-background" alt="Space" />

    <!-- Hero Content -->
    <div class="container">
      <!-- Hero Text -->
      <div class="hero-content">
        <!-- Small Heading -->
        <p class="hero-small-title">EXPLORE</p>

        <!-- Main Heading -->
        <h1>Discover Our Universe</h1>

        <!-- Hero Description -->
        <p class="hero-text">
          Journey beyond our world and discover the planets, galaxies and stars
          of our universe.
        </p>

        <!-- Explore Button -->
        <a href="#explore" class="explore-button"> Explore Universe </a>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
