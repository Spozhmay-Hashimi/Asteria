<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Asteria | News & Gallery</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <!-- =========================
     HERO SECTION
========================= -->

    <section class="hero-section">
      <div class="container">
        <div class="hero-content">
          <div class="hero-text">
            <span class="section-label"> NEWS & GALLERY </span>

            <h1>
              Latest News &<br />
              <span>Stunning Gallery</span>
            </h1>

            <p>
              Stay updated with the latest space news, breathtaking images and
              inspiring stories from the cosmos.
            </p>
          </div>

          <div class="hero-image">
            <img
              src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1200&q=80"
              alt="Galaxy"
            />
          </div>
        </div>
      </div>
    </section>
     <!-- =========================
     MAIN CONTENT
========================= -->

<main class="main-section">
  <div class="container">
    <!-- FILTER BUTTONS -->

    <div class="filter-buttons">
      <button class="filter-btn active">Latest News</button>

      <button class="filter-btn">Gallery</button>

      <button class="filter-btn">Videos</button>
    </div>

    <!-- =========================
         NEWS GRID
    ========================== -->
    <div class="row g-4">
      <!-- CARD 1 -->

      <div class="col-12 col-md-6 col-lg-4">
        <article class="news-card">
          <div class="news-image">
            <img
              src="https://images.unsplash.com/photo-1516339901601-2e1b62dc0c45?auto=format&fit=crop&w=900&q=80"
              alt="Black Hole"
            />
          </div>

          <div class="news-content">
            <span class="news-date"> Sep 14, 2025 </span>

            <h2>Astronomers Discover a New Type of Black Hole</h2>

            <a href="#" class="read-more">
              Read More
              <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </article>
      </div>
  </body>
</html>
